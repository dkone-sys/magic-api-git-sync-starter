name: Publish to Maven Central

# 依赖的 GitHub Secrets：
#   CENTRAL_USERNAME / CENTRAL_PASSWORD: Sonatype Central 的 User Token 用户名/密码
#   GPG_PRIVATE_KEY: 必须带 "base64:" 前缀，如 base64:LS0tLS1CRUdJTi...
#   GPG_PASSPHRASE: GPG 私钥密码（无密码则为空字符串）

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish to Maven Central
        run: mvn --batch-mode deploy -Dgpg.passphrase="$GPG_PASSPHRASE"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
